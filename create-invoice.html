<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lag faktura – SkattPro</title>
  <link rel="stylesheet" href="skattpro-nav.css">
  <style>
    .page-header { padding: 40px 24px 24px; max-width: 900px; margin: 0 auto; }
    .page-header h1 { font-size: 2rem; font-weight: 800; }
    main { max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }
    section { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
    section + section { margin-top: 20px; }
    .section-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 18px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .col-2 { grid-column: span 2; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .col-2 { grid-column: 1; } }
    label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 12px; background: white; color: var(--ink); font-family: inherit; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79,70,229,0.1); }
    .line { display: grid; grid-template-columns: 6fr 2fr 2fr 2fr; gap: 14px; align-items: end; }
    @media (max-width: 640px) { .line { grid-template-columns: 1fr 1fr; } }
    .sum { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .total-price { font-size: 1.6rem; font-weight: 800; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo"><span class="logo-mark">S</span> SkattPro</a>
    <div class="menu" id="primaryMenu">
      <a href="index.html">Skatt</a>
      <a href="kalkulator.html">Kalkulator</a>
      <a href="faktura.html">Faktura</a>
      <a href="forskuddsskatt.html">Forskudd</a>
      <a href="skattefrister.html">Frister</a>
      <a href="utgiftssporing.html">Utgifter</a>
      <a href="paminnelser.html">Påminnelser</a>
      <a href="pro-features.html">Pro</a>
    </div>
    <div class="nav-actions"><a href="ansatte-og-lonn/" class="btn btn-ghost">Ansatte</a></div>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" onclick="document.getElementById('primaryMenu').classList.toggle('open')">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/></svg>
    </button>
  </nav>

  <header class="page-header">
    <h1>Lag ny faktura</h1>
  </header>

  <main>
    <form id="invoiceForm" onsubmit="submitInvoice(event)">
      <section>
        <h2 class="section-title">Din informasjon (Avsender)</h2>
        <div class="grid">
          <div><label>Navn/Firmanavn *</label><input name="sellerName" required></div>
          <div><label>ENK-nummer</label><input name="sellerEnk"></div>
          <div><label>E-post *</label><input name="sellerEmail" type="email" required></div>
          <div><label>Telefon</label><input name="sellerPhone" type="tel"></div>
          <div class="col-2"><label>Adresse</label><input name="sellerAddress"></div>
          <div><label>Postnummer</label><input name="sellerZip"></div>
          <div><label>Poststed</label><input name="sellerCity"></div>
          <div class="col-2"><label>Bankkonto</label><input name="sellerBank" placeholder="1234.56.78901"></div>
          <div><label>Vipps-nummer</label><input name="sellerVipps"></div>
        </div>
      </section>

      <section>
        <h2 class="section-title">Kunde (Mottaker)</h2>
        <div class="grid">
          <div><label>Navn/Firmanavn *</label><input name="buyerName" required></div>
          <div><label>Organisasjonsnummer</label><input name="buyerOrg"></div>
          <div class="col-2"><label>E-post</label><input name="buyerEmail" type="email"></div>
          <div class="col-2"><label>Adresse</label><input name="buyerAddress"></div>
        </div>
      </section>

      <section>
        <h2 class="section-title">Fakturalinjer</h2>
        <div id="lineItems" class="space-y-4">
          <div class="line">
            <div><label>Beskrivelse *</label><input name="description[]" required placeholder="Beskriv tjeneste eller produkt"></div>
            <div><label>Antall *</label><input name="quantity[]" type="number" value="1" min="1" required></div>
            <div><label>Pris (kr) *</label><input name="price[]" type="number" min="0" step="0.01" required placeholder="0.00" oninput="calculate()"></div>
            <div><label>Total</label><div class="px-3 py-2 bg-gray-50 border rounded-12 text-right font-semibold total-item">0 kr</div></div>
          </div>
        </div>
        <button type="button" onclick="addLine()" style="margin-top:14px;padding:10px 16px;background:var(--light);border:1px solid var(--border);border-radius:10px;font-weight:600;color:var(--dark);cursor:pointer;font-family:inherit">+ Legg til linje</button>
      </section>

      <section>
        <h2 class="section-title">Betalingsvilkår</h2>
        <div class="grid">
          <div><label>Betalingstermin (dager)</label><input name="paymentTerms" type="number" value="14" min="0"></div>
          <div><label>Forfallsdato</label><input name="dueDate" type="date"></div>
        </div>
      </section>

      <section>
        <div class="sum">
          <div>
            <h3 class="section-title" style="margin-bottom:6px">Oppsummering</h3>
            <p style="color:var(--gray);margin-bottom: 2px">Subtotal: <strong id="subtotalDisplay">0 kr</strong></p>
            <p style="color:var(--gray);margin-bottom: 2px">MVA (25%): <strong id="vatDisplay">0 kr</strong></p>
            <p style="font-size:1.15rem;font-weight:700;margin-top:6px">Total: <span class="total-price" id="totalDisplay">0 kr</span></p>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button type="submit" style="padding:12px 18px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit">Lag faktura PDF</button>
          </div>
        </div>
      </section>
    </form>
  </main>

  <script>
  function calculate(){
    let subtotal=0;
    document.querySelectorAll('#lineItems .line').forEach(el => {
      const qty = parseFloat(el.querySelector('[name="quantity[]"]').value || 0);
      const price = parseFloat(el.querySelector('[name="price[]"]').value || 0);
      const row = qty * price;
      el.querySelector('.total-item').textContent = row.toFixed(2) + ' kr';
      subtotal += row;
    });
    const vat = subtotal * 0.25;
    const total = subtotal + vat;
    document.getElementById('subtotalDisplay').textContent = subtotal.toFixed(2) + ' kr';
    document.getElementById('vatDisplay').textContent = vat.toFixed(2) + ' kr';
    document.getElementById('totalDisplay').textContent = total.toFixed(2) + ' kr';
  }
  function addLine(){
    const c = document.getElementById('lineItems');
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = '<div><label>Beskrivelse *</label><input name="description[]" required placeholder="Beskriv tjeneste eller produkt"></div><div><label>Antall *</label><input name="quantity[]" type="number" min="1" required></div><div><label>Pris (kr) *</label><input name="price[]" type="number" min="0" step="0.01" required placeholder="0.00" oninput="calculate()"></div><div><label>Total</label><div class="px-3 py-2 bg-gray-50 border rounded-12 text-right font-semibold total-item">0 kr</div></div>';
    c.appendChild(div);
  }

  const today = new Date();
  const due = new Date(today);
  due.setDate(due.getDate() + 14);
  document.querySelector('[name="dueDate"]').value = due.toISOString().split('T')[0];

  async function submitInvoice(e){
    e.preventDefault();
    const form = new FormData(e.target);
    const descriptions = form.getAll('description[]');
    const quantities = form.getAll('quantity[]');
    const prices = form.getAll('price[]');
    const payload = {
      seller: {
        name: form.get('sellerName'),
        enkNumber: form.get('sellerEnk'),
        email: form.get('sellerEmail'),
        phone: form.get('sellerPhone'),
        address: form.get('sellerAddress'),
        zip: form.get('sellerZip'),
        city: form.get('sellerCity'),
        bankAccount: form.get('sellerBank'),
        vippsNumber: form.get('sellerVipps')
      },
      buyer: {
        name: form.get('buyerName'),
        organizationNumber: form.get('buyerOrg'),
        email: form.get('buyerEmail'),
        address: form.get('buyerAddress')
      },
      items: descriptions.map((desc, i) => ({ description: desc, quantity: parseFloat(quantities[i]), price: parseFloat(prices[i]) })),
      dueDate: form.get('dueDate'),
      paymentTerms: parseInt(form.get('paymentTerms')) || 14
    };
    try {
      const res = await fetch('http://localhost:3001/api/invoices/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error('Failed');
      const data = await res.json();
      window.location.href = 'http://localhost:3001' + data.downloadUrl;
      alert('✅ Faktura generert! Nedlastingen starter snart.');
    } catch (err) {
      console.error(err);
      alert('❌ Kunne ikke generere faktura. Sjekk at backend kjører på localhost:3001.');
    }
  }
  calculate();
  </script>
</body>
</html>
