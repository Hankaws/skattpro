<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skattekalkulator 2026 - SkattPro</title>
<link rel="stylesheet" href="skattpro-modern.css">
<style>
body { background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%); min-height: 100vh; }
.calc-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
.calc-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); }
.calc-header { text-align: center; margin-bottom: 40px; }
.calc-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #6366f1, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.calc-header p { color: #64748b; font-size: 1.1rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 32px; }
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-group label { font-weight: 600; color: #334155; font-size: 0.9rem; }
.form-group input, .form-group select { padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; font-family: inherit; transition: all 0.2s; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
.result-section { background: linear-gradient(135deg, #6366f1, #0ea5e9); border-radius: 16px; padding: 32px; color: white; margin-top: 32px; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
.result-item { text-align: center; }
.result-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 8px; font-weight: 500; }
.result-value { font-size: 2.5rem; font-weight: 800; line-height: 1.2; }
.result-sub { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
.btn-calculate { width: 100%; padding: 16px; background: linear-gradient(135deg, #6366f1, #0ea5e9); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); }
.btn-calculate:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5); }
.back-link { display: inline-flex; align-items: center; gap: 8px; color: #64748b; text-decoration: none; font-weight: 600; margin-bottom: 20px; padding: 8px 0; }
.back-link:hover { color: #6366f1; }
@media (max-width: 768px) { .calc-card { padding: 24px; } .calc-header h1 { font-size: 2rem; } .result-value { font-size: 2rem; } }
</style>
</head>
<body>
<div class="calc-container">
<a href="index.html" class="back-link">← Tilbake til startsiden</a>
<div class="calc-card">
<div class="calc-header">
<h1>Skattekalkulator 2026</h1>
<p>Beregn skatt, trinnskatt, trygdeavgift og nettoinntekt nøyaktig</p>
</div>

<div class="form-grid">
<div class="form-group">
<label for="income">Brutto årsinntekt (kr)</label>
<input type="number" id="income" placeholder="f.eks. 500000" min="0" step="1000">
</div>

<div class="form-group">
<label for="kommune">Kommune</label>
<select id="kommune">
<option value="">Velger kommune...</option>
</select>
</div>

<div class="form-group">
<label for="age">Alder</label>
<input type="number" id="age" placeholder="f.eks. 35" min="0" max="150">
</div>

<div class="form-group">
<label for="class">Skatteklasse</label>
<select id="class">
<option value="1">Klasse 1 (Enslig)</option>
<option value="2">Klasse 2 (Samboer/gift)</option>
</select>
</div>

<div class="form-group">
<label for="pension">Fradrag (kr)</label>
<input type="number" id="pension" placeholder="f.eks. 10000" min="0" step="1000" value="0">
</div>

<div class="form-group">
<label for="type">Inntektstype</label>
<select id="type">
<option value="lonn">Lønn</option>
<option value="naering">Næringsinntekt</option>
<option value="pensjon">Pensjon</option>
</select>
</div>
</div>

<button class="btn-calculate" onclick="calculate()">Beregn skatt</button>

<div class="result-section" id="result" style="display:none;">
<div class="result-grid">
<div class="result-item">
<div class="result-label">Trinnskatt</div>
<div class="result-value" id="bracketTax">0 kr</div>
</div>
<div class="result-item">
<div class="result-label">Trygdeavgift</div>
<div class="result-value" id="socialSecurity">0 kr</div>
</div>
<div class="result-item">
<div class="result-label">Kommuneskatt</div>
<div class="result-value" id="municipalTax">0 kr</div>
</div>
<div class="result-item">
<div class="result-label">Total skatt</div>
<div class="result-value" id="totalTax">0 kr</div>
<div class="result-sub" id="taxRate">0%</div>
</div>
</div>
<div style="text-align:center;margin-top:24px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.2)">
<div class="result-label">Nettoinntekt per år</div>
<div class="result-value" id="netIncome" style="font-size:3rem;font-weight:900">0 kr</div>
</div>
</div>
</div>
</div>

<script>
// Load kommuner
async function loadKommuner() {
try {
const res = await fetch('kommuner.json');
const data = await res.json();
const select = document.getElementById('kommune');
select.innerHTML = '<option value="">Velg kommune</option>';
data.sort((a,b) => a.navn.localeCompare(b.navn)).forEach(k => {
const opt = document.createElement('option');
opt.value = k.sats;
opt.textContent = k.navn;
select.appendChild(opt);
});
} catch (e) {
const select = document.getElementById('kommune');
select.innerHTML = '<option value="22.5">Oslo (standard)</option><option value="21.0">Bergen</option><option value="20.5">Trondheim</option><option value="21.5">Stavanger</option><option value="19.5">Tromsø</option>';
console.error('Kommune loading failed:', e);
}
}

function formatNOK(n) { return new Intl.NumberFormat('no-NO', { style: 'currency', currency: 'NOK', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n); }

function calculate() {
const income = parseFloat(document.getElementById('income').value) || 0;
const kommuneSats = parseFloat(document.getElementById('kommune').value) || 22.5;
const age = parseInt(document.getElementById('age').value) || 35;
const sclass = document.getElementById('class').value;
const fradrag = parseFloat(document.getElementById('pension').value) || 0;
const type = document.getElementById('type').value;

// Trygdeavgift
let trygdeavgiftSats = 0.082;
if (type === 'pensjon') trygdeavgiftSats = 0.051;
if (age >= 67 || type === 'pensjon') trygdeavgiftSats = 0.051;
const trygdeavgift = income * trygdeavgiftSats;

// Personfradrag
let personfradrag = 87400;
if (age >= 67) personfradrag = 101075;
const skattegrunnlag = Math.max(0, income - fradrag - personfradrag);

// Trinnskatt 2026
let trinnskatt = 0;
let rest = skattegrunnlag;
const satser = [
{grense: 206100, sats: 0.017},
{grense: 292400, sats: 0.04},
{grense: 670000, sats: 0.137},
{grense: 938000, sats: 0.167}
];

let prevGrense = 0;
satser.forEach(s => {
if (rest > 0) {
const del = Math.min(rest, s.grense - prevGrense);
if (del > 0) trinnskatt += del * s.sats;
rest -= del;
prevGrense = s.grense;
}
});
if (rest > 0) trinnskatt += rest * 0.167;

// Kommuneskatt
const kommuneskatt = skattegrunnlag * (kommuneSats / 100);

// Totalt
const totalSkatt = trygdeavgift + trinnskatt + kommuneskatt;
const netto = income - totalSkatt;
const skatteprosent = income > 0 ? (totalSkatt / income * 100) : 0;

// Vis resultat
document.getElementById('bracketTax').textContent = formatNOK(trinnskatt);
document.getElementById('socialSecurity').textContent = formatNOK(trygdeavgift);
document.getElementById('municipalTax').textContent = formatNOK(kommuneskatt);
document.getElementById('totalTax').textContent = formatNOK(totalSkatt);
document.getElementById('taxRate').textContent = skatteprosent.toFixed(1) + '%';
document.getElementById('netIncome').textContent = formatNOK(netto);
document.getElementById('result').style.display = 'block';
document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

loadKommuner();
</script>
</body>
</html>
